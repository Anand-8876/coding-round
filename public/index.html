<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodeArena</title>
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2300ff41'/><text x='16' y='21' font-size='13' font-family='monospace' font-weight='bold' fill='black' text-anchor='middle'>&lt;/&gt;</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="left">
      <a class="logo" href="#/problems"><span class="logo-box">&lt;/&gt;</span><span class="logo-text">CodeArena</span></a>
      <nav>
        <a href="#/problems" data-nav="problems">Problems</a>
        <a href="#/submissions" data-nav="submissions">Submissions</a>
        <a href="#/leaderboard" data-nav="leaderboard">Leaderboard</a>
      </nav>
    </div>
    <div class="right">
      <span class="points" id="points-badge"></span>
      <span class="username" id="username"></span>
      <button class="btn btn-ghost small" id="logout-btn">Log out</button>
    </div>
  </header>

  <main id="app"></main>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal card" role="dialog" aria-modal="true" id="modal-body"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script src="/app.js"></script>
</body>
</html>
